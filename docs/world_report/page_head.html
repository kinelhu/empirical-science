<title>Seed 12345 Field Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,700;62..125,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field notebook, one column of findings, charts drawn to scale, a ledger table that scrolls on its own. */
:root {
  --paper: #f3f4f1; --sheet: #fbfbf9; --ink: #1b2530; --muted: #5a6670; --rule: #d3d8da;
  --accent: #2f5d8a; --gain: #0d8a6a; --loss: #c4521a; --cold: #2b7bb4; --hot: #c4521a; --soft: #e8ecee;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11161b; --sheet: #161d23; --ink: #e2e7ea; --muted: #94a0aa; --rule: #2a343c;
  --accent: #7fb0dc; --gain: #3dbb95; --loss: #ea8650; --cold: #66aee0; --hot: #ea8650; --soft: #1e272e; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #11161b; --sheet: #161d23; --ink: #e2e7ea; --muted: #94a0aa; --rule: #2a343c;
  --accent: #7fb0dc; --gain: #3dbb95; --loss: #ea8650; --cold: #66aee0; --hot: #ea8650; --soft: #1e272e; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font: 15px/1.6 var(--f-body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 80px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(2.1rem, 6vw, 3.4rem); font-weight: 800; font-stretch: 75%; line-height: 1.02; margin: 0 0 14px; }
h2 { font-size: 1.55rem; font-weight: 700; font-stretch: 85%; margin: 56px 0 6px; padding-top: 14px; border-top: 2px solid var(--ink); }
h3 { font-size: 1.08rem; font-weight: 700; font-stretch: 100%; margin: 0 0 4px; }
p { max-width: 66ch; margin: 0 0 12px; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 62ch; }
.eyebrow { font: 500 0.74rem/1 var(--f-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border-block: 1px solid var(--rule); margin: 26px 0 8px; }
.facts div { padding: 12px 14px 12px 0; }
.facts dt { font: 500 0.72rem/1.2 var(--f-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 4px 0 0; font: 600 1.05rem/1.3 var(--f-body); }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.gain { color: var(--gain); } .loss { color: var(--loss); } .muted { color: var(--muted); }
.timeline { list-style: none; margin: 18px 0 0; padding: 0; border-left: 2px solid var(--rule); }
.timeline li { position: relative; padding: 0 0 18px 22px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.timeline li.proj::before { background: var(--sheet); border: 2px solid var(--accent); width: 8px; height: 8px; }
.timeline .when { font: 500 0.78rem/1.3 var(--f-data); color: var(--muted); }
.timeline .tag { font: 500 0.66rem/1 var(--f-data); letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 1px; }
.tag.meas { background: var(--accent); color: var(--sheet); } .tag.proj { border: 1px solid var(--accent); color: var(--accent); }
.figure { background: var(--sheet); border: 1px solid var(--rule); padding: 16px; margin: 16px 0; }
.figure svg { display: block; width: 100%; height: auto; }
.caption { font-size: 0.82rem; color: var(--muted); margin-top: 8px; max-width: none; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; font-size: 0.86rem; width: 100%; min-width: 760px; }
th { text-align: left; font: 500 0.7rem/1.2 var(--f-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--ink); position: sticky; top: 0; background: var(--sheet); }
td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.r, th.r { text-align: right; }
.hyps { display: grid; gap: 0; margin-top: 10px; }
.hyp { display: grid; grid-template-columns: 56px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.hyp .id { font: 800 1.5rem/1 var(--f-display); font-stretch: 75%; color: var(--accent); }
.hyp .ev { font-size: 0.86rem; color: var(--muted); margin-top: 6px; }
.hyp .ev b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.two > * { min-width: 0; }
.pill { font: 500 0.72rem/1 var(--f-data); padding: 3px 7px; border-radius: 99px; background: var(--soft); color: var(--ink); white-space: nowrap; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 520px) { .hyp { grid-template-columns: 1fr; gap: 4px; } }
</style>
