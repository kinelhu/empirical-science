[technology-description]
es-pressure-heating=A heater that brings fluid additives to __1__ °C. It burns pressure charges, made from tungsten carbide.
es-chilling=Chilled versions of the fluid additives, down to __1__ °C, made in a cryogenic plant with cold fluoroketone. A chilled fluid is dosed like the fluid itself, at its own temperature.
es-scrap-forensics-1=Scrap samples can be traced to the products made from scrap's contents.
es-scrap-forensics-2=Scrap samples can be traced to any product.
es-mixtures=Dose up to three additives in one machine.
es-theory=A model fitted to your evidence. It estimates what each additive family does and ranks untested additives by their predicted gain.
es-thermal-studies=Heaters that bring a fluid additive to its own best temperature.
es-quality-additives=Rare materials used as additives to raise product quality.
es-precision-instruments=Reduces trial noise.
es-station-throughput=Increases the samples analysed per science pack.
es-circuit-instrumentation=Connects experiments to the circuit network. Doses can be set by signals, and analysis stations send their results.
es-empirical-method=Test additives on your recipes.

