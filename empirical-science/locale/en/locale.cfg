es-data-in-mainline=Technologies that use the chosen science pack, or any pack after it, also cost empirical science packs.
es-data-in-endless=Endless technologies, such as mining productivity and weapon damage, also cost empirical science packs.
es-world-strength=Set when the map is created. Cannot be changed afterwards.\nOn Harsh, trials cost more and are noisier. Additives that pay are rarer and stronger, and work over a narrower range of doses.
es-science-seed=Seeds the hidden world, which decides what each additive does. 0 uses the map's seed. Read when the map is created.\nThe same science seed, world strength and mod version give the same hidden world on any map.
es-derive-targets=Every science pack a lab accepts becomes a target, with its process mix derived from its recipe. For mods that do not register their own targets.

