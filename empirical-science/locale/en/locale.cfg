[entity-description]
es-fluid-heater=Heats any fluid that passes through it to __1__ °C. Each fluid additive works best at its own temperature.
es-fluid-chiller=Chills liquid premixes to __1__ °C. Takes them only at __2__ °C, the temperature they are made at. Burns cold charges.
es-hopper=Supplies additives to every machine it shares an edge with. Items go in by inserter. Residues leave with the machine's products.
es-fluid-hopper=Supplies a fluid additive to every machine it shares an edge with. Fluids go in by pipe.
es-test-bench=Runs trials. Each trial uses one batch of ingredients and gives back __1__% of its products and a sample. Set the dose in the Dosing panel. Without a dose it runs a control.
es-analysis-station=Analyses a sample every __4__ s, faster at higher quality. Each science pack of the sample's tier covers __3__ samples.\nHolds __2__ samples waiting, of the science packs it holds. Science packs go in the last slots, one kind per slot. Empirical science packs appear in the slots before them.
es-station-port=Sends the station's results on its target to the circuit network, in per mille. [virtual-signal=es-page] chooses the page, and an additive's signal selects that additive. The Station signals tip lists the pages.

