[tips-and-tricks-item-description]
es-title=Every map hides how additives change its recipes. Test benches run trials with a dose, and analysis stations read what the samples show.
es-first-experiment=Build a [entity=es-test-bench] test bench and choose a trial from its recipe list. Place a [entity=es-hopper] hopper against it, put an additive in the hopper, and set the dose in the bench's Dosing panel.\nA bench with no dose set runs the control. Every result is measured against the control.
es-samples=Each trial makes a sample of its target's science pack, such as an [item=es-sample-automation-science-pack] automation science pack sample. An [entity=es-analysis-station] analysis station reads the samples of the science packs it holds.
es-screen=Open the Empirical Science screen from the shortcut bar or with __CONTROL__es-open-science__. Every station adds to the same results.
es-screening=The Net column shows the gain after the additive's own cost at its best dose. Packs per sample shows how many empirical science packs its next sample would make.
es-production=Save a dose as a preset on the Dose-response tab. Any assembling machine making that product can then use it, as long as a hopper touches it.
es-families=Additives of one family respond alike to a process. They help metalwork, chemistry or electronics by similar amounts, and have similar dose-response shapes on its targets.\nThe Theory tab gathers what your evidence says about each family.
es-alt=Press __CONTROL__show-info__ to see each bench's and machine's dose. A greyed dose is not being supplied.
es-dose-signal=A bench or machine in circuit mode takes its doses from circuit signals. Each additive's signal sets its dose. Tick "Doses from circuit signals" in its Dosing panel.\nThe Example blueprints shortcut includes this build.
es-sweep=A clock and an [entity=arithmetic-combinator] can step a bench through its doses. Each sample records the dose it was made with.
es-residues=Every solid additive leaves a residue when dosed, one for each solid in it, so a premix leaves two. Residues leave the machine with its products.\nBiological additives leave spoilage. Fluids and quality additives leave nothing.\nResidues can be dosed. One that still helps a recipe can be activated into a catalyst.
es-sample-kinds=Each science pack has its own kind of sample, with that pack on its cover. A trial makes the sample of its target's science pack.\nAn [entity=es-analysis-station] analysis station holds __1__ samples waiting, of the science packs it holds.
es-science-packs=Each analysed sample makes empirical science packs. How many depends on how open its question is. A question is an additive, or a set of additives, on one product on one planet.\nA question is open while its answer is unclear. Samples make fewer packs as the answer becomes clear. A settled question still makes a few, more on a product whose trial costs more.\nA set of additives makes few until each of them has been tested alone on that product.
es-fluid-hoppers=Fluid additives are dosed from a [entity=es-fluid-hopper] fluid hopper. Pipes connect at its ends, and a pipe line can pass through several.\nIt doses every machine along its sides that makes a product the mod studies.
es-temperature=Fluid additives and liquid premixes each work best at a temperature of their own. Results are kept in temperature bands, one result per band.\nFluid heaters warm a fluid.
es-temperature-space-age=Fluid additives and liquid premixes each work best at a temperature of their own. Results are kept in temperature bands, one result per band.\nFluid heaters warm a fluid, and the pressure heater reaches far hotter. The fluid chiller cools liquid premixes.
es-findings=A finding is an effect proven above its bar and put into production, with enough products made with its dose.\nEach planet you reach has a quota of findings. Some effects count as major findings across all products. The Findings tab shows how far each one has come.
es-ripeness=Biological additives keep spoiling in their hoppers, and each works best at a ripeness of its own.\nA dose records how far its units had spoiled, and results are kept in ripeness bands.
es-scrap-samples=Recycling scrap sometimes recovers a scrap sample. An analysis station reads it as one result on a product made from scrap, with the additive and dose drawn at analysis.\nScrap samples spoil quickly and make no empirical science packs.
es-quality-additives=A quality additive raises the chance that a craft comes out one quality level higher. Ordinary additives never change quality.\nThe Quality column shows each quality additive's upgrade rate once enough units have been made with it.
es-station-signals=The port on an [entity=es-analysis-station] analysis station sends what the station has measured on its target, in per mille. A recipe signal on its wire picks the target, [virtual-signal=es-page] the page, and an additive's signal selects that additive.\n\nPage 0, Results: each additive's lower bound at its best dose, [virtual-signal=es-n] samples on the target and [virtual-signal=es-quality] the best upgrade rate. For the selected additive, [virtual-signal=es-dose] its best dose.\nPage 1, Screening: the empirical science packs each additive's next sample makes. For the selected additive, [virtual-signal=es-dose] its most open tested dose and [virtual-signal=es-n] its samples there.\nPage 2, Selected result: the selected additive at [virtual-signal=es-dose]. [virtual-signal=es-n] samples, [virtual-signal=es-mean] mean gain, [virtual-signal=es-half] range half-width, [virtual-signal=es-lo] lower bound, and [virtual-signal=es-speed] [virtual-signal=es-cleanliness] [virtual-signal=es-efficiency] its side effects.\nPage 3, Best composition: the best tested composition, as doses.\n\nPages 1 and 2 need Lab circuits 2, page 3 Lab circuits 3. Only page 3 can set a machine's doses directly. Every page but 0 also sends [virtual-signal=es-page] and the target's recipe.
es-port=With [virtual-signal=es-page] at 3 and a target's recipe signal on its wire, a station's port sends the best composition tested so far, as doses.\nA machine in circuit mode wired to the port uses those doses.
es-stages=Empirical science packs unlock the other tools: measurements of speed, cleanliness, efficiency and freshness, mixtures, the Theory tab, quality additives, lab circuits and fluid heating.

